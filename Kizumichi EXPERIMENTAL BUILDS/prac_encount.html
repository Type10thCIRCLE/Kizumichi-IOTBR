<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encounter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/gimmicks/tutorial.css">

<!-- ═══════════════ ENCOUNTER SETUP — edit this block ═══════════════ -->
<script>
window.ENCOUNTER = {
  // ── what the player sees
  name: 'TRAINING PROTOCOL',
  subtitle: 'Familiarise yourself with the battle system. The Training Dummy will not fall — your real test awaits.',
  location: 'FIELD',
  bg: 'FC-MEDIA/field.jpg',   // background image
  bgm: 'FC-OST/The air we breathe.mp3',   // battle music

  // ── who they fight (keys from ENEMY_TEMPLATES in js/battle-engine.js)
  enemies: ['training_dummy'],
  isBoss: false,
  isTutorial: true,

  // ── party + items loadout ('stage1'..'stage4', see PARTY_PRESETS in the engine)
  party: 'stage1',

  // ── battle start / end
  introLog: 'The Training Dummy stands ready. It cannot be felled.',   // first line in the battle log
  nextPage: 'c2s1.html',   // where "Keep Moving" goes
  victoryMusic: 'FC-OST/Interlude, the breathing life.mp3',   // overrides the default victory music
  resultTitle: 'Training Complete',   // overrides "Encounter Finished"

  // ── gimmick: null, 'chainkeeper' or 'tutorial'  (must match the <script> line below)
  gimmick: 'tutorial'
};
</script>
</head>
<body>

<!-- the battle itself (markup + logic + enemies) -->
<script src="js/battle-engine.js"></script>
<!-- gimmick for this encounter — remove this line (and set gimmick: null) for a normal fight -->
<script src="js/gimmicks/tutorial.js"></script>

</body>
</html>
