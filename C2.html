<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傷道 | Inheritance of the Broken Road</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 100vw;
            overflow: hidden;
            opacity: 1;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }

        .overlay-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 18px;
            opacity: 0;
            pointer-events: none;
        }

        .fade {
            animation: fadeSequence 5s ease forwards;
        }

        @keyframes fadeSequence {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* NEW: fade-out effect */
        .fade-out {
            animation: fadeOut 0.8s ease forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }
    </style>
</head>
<body>

    <video id="cgVideo" autoplay playsinline>
        <source src="FC-MEDIA/op2.webm" type="video/mp4">
    </video>


    <script>
        const video = document.getElementById("cgVideo");
        const text = document.getElementById("overlayText");

        let isSkipping = false;

        // Sync with FC settings panel (musicVol) so cutscene audio
        // respects whatever the player set inside the game.
        function fcLoadSettings() {
            try {
                return Object.assign(
                    { musicVol: 70, sfxVol: 80 },
                    JSON.parse(localStorage.getItem('fc_settings') || '{}')
                );
            } catch (e) {
                return { musicVol: 70, sfxVol: 80 };
            }
        }
        video.volume = fcLoadSettings().musicVol / 100;

        // Force autoplay
        window.addEventListener("load", () => {
            video.play().catch(err => console.log("Autoplay blocked:", err));

            setTimeout(() => {
                if (text) text.classList.add("fade");
            }, 300);
        });

        function redirectToLauncher() {
            window.location.href = "prac_encount.html";
        }

        // NEW: smooth skip with fade
        function skipVideo() {
            if (isSkipping) return;
            isSkipping = true;

            document.body.classList.add("fade-out");

            setTimeout(() => {
                redirectToLauncher();
            }, 800);
        }

        // Fade out when video ends
        video.addEventListener("ended", () => {
            skipVideo();
        });

        // Controls
        document.addEventListener("keydown", (e) => {
            if (e.key.toLowerCase() === "p") {
                video.paused ? video.play() : video.pause();
            }

            if (e.key.toLowerCase() === "s") {
                skipVideo();
            }
        });
    </script>

</body>
</html>
