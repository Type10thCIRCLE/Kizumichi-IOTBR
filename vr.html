<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>傷道 | Inheritance of the Broken Road — 3D / Cardboard</title>
<style>
  html,body{margin:0;height:100%;background:#110909;overflow:hidden;color:#f7eeee;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:rgba(17,9,9,.94);text-align:center;padding:20px}
  #start h1{margin:0;font-weight:300;letter-spacing:.12em;color:#ffb0b6;font-size:1.5rem}
  #start p{margin:0;max-width:520px;font-size:.85rem;opacity:.7;line-height:1.5}
  select,button{font:inherit;padding:10px 18px;border-radius:3px;border:1px solid #e2505f;
    background:#1c0f0f;color:#f7eeee;cursor:pointer}
  button:hover{background:#e2505f}
  #hint{position:fixed;left:12px;bottom:10px;font-size:.72rem;opacity:.55;line-height:1.5;
    pointer-events:none;z-index:2;white-space:pre}
h1,h2,h3,h4,h5,h6,b,strong,th{font-weight:400}
</style>
</head>
<body>
<div id="start">
  <h1>傷道 — 3D / CARDBOARD</h1>
  <p>Reads the normal scene files and plays them as a 3D space: curved backdrop, portraits standing in depth,
     dialogue floating in front of you. Mouse pointing = looking. Keyboard = advancing.</p>
  <select id="chap"></select>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button id="b3d">Play in 3D</button>
    <button id="bcb">Play in Cardboard (split screen)</button>
  </div>
  <p id="warn"></p>
</div>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================ CONFIG ============================ */
const CHAPTERS = ["C1.html","C1S2.html","C1S3.html","C1S4.html","c2s1.html","c2s2.html","c2s3.html",
  "c2s4.html","c2s5.html","c2s6.html","C3.html","C3S2.html","c3s3.html","c3s4.html","c3s5.html","c3s6.html",
  "c3s7.html","C4.html","C4S2.html","C4S3.html","C4S4.html","C4S5.html","C4S6.html","demochapt.html"];
const BG_R = 14, PORTRAIT_R = 6, PORTRAIT_H = 4.2;
const YAW_MAX = .9, PITCH_MAX = .45;
const TYPE_CPS = 45, AUTO_DELAY = 2.5;

const $ = id => document.getElementById(id);
const sel = $('chap');
CHAPTERS.forEach(c => sel.add(new Option(c, c)));
const qp = new URLSearchParams(location.search).get('scene');
if (qp) { if (![...sel.options].some(o => o.value === qp)) sel.add(new Option(qp, qp)); sel.value = qp; }
if (location.protocol === 'file:')
  $('warn').textContent = "⚠ Opened as a file. Browsers block loading scene files this way — run a local server in this folder (e.g. python -m http.server) and open http://localhost:8000/vr.html";

/* ============================ THREE SETUP ============================ */
const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0606);
const cam = new THREE.PerspectiveCamera(70, 1, .1, 100);
cam.rotation.order = 'YXZ';
const stereoCam = new THREE.StereoCamera(); stereoCam.aspect = .5;
const loader = new THREE.TextureLoader();
const asURL = (dir, f) => dir + encodeURI(f);
function prep(t) { t.encoding = THREE.sRGBEncoding; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; return t; }

/* --- distortion pass (Cardboard lenses) --- */
let rt = null, stereo = false, distort = true, K1 = .22, K2 = .24;
const qScene = new THREE.Scene(), qCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const qMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: null }, k1: { value: K1 }, k2: { value: K2 } },
  vertexShader: 'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader: `varying vec2 v;uniform sampler2D t;uniform float k1,k2;
    void main(){vec2 c=(v-.5)*2.;float r=dot(c,c);vec2 s=c*(1.+k1*r+k2*r*r)*.7*.5+.5;
    if(s.x<0.||s.x>1.||s.y<0.||s.y>1.){gl_FragColor=vec4(0.,0.,0.,1.);}else{gl_FragColor=texture2D(t,s);}}`
});
qScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), qMat));

/* --- particles for depth --- */
const N = 220, pp = new Float32Array(N * 3);
for (let k = 0; k < N; k++) {
  const a = Math.random() * Math.PI * 2, r = 2.5 + Math.random() * 9;
  pp[k*3] = Math.sin(a) * r; pp[k*3+1] = (Math.random() - .5) * 8; pp[k*3+2] = -Math.cos(a) * r;
}
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
const dust = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffd9dc, size: .035, transparent: true, opacity: .45, depthWrite: false }));
scene.add(dust);

/* --- dialogue panel (canvas texture, floats in the world) --- */
const PW = 1280, PH = 420, FS = 36, LH = 48, MAXL = 5, TXW = 1180;
const pc = document.createElement('canvas'); pc.width = PW; pc.height = PH;
const px = pc.getContext('2d');
const ptex = new THREE.CanvasTexture(pc); ptex.encoding = THREE.sRGBEncoding; ptex.minFilter = THREE.LinearFilter; ptex.generateMipmaps = false;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 3.7 * PH / PW),
  new THREE.MeshBasicMaterial({ map: ptex, transparent: true, depthWrite: false }));
panel.position.set(0, -1.35, -3.1); panel.renderOrder = 100; scene.add(panel); panel.lookAt(0, 0, 0);

/* --- backdrop meshes (cross-faded curved panoramas) --- */
const bgs = []; let curBg = '', bgOrder = 0;
function setBg(file) {
  if (!file || file === 'blank' || file === 'none' || file === curBg) return;
  curBg = file;
  loader.load(asURL('FC-MEDIA/', file), tex => {
    if (file !== curBg) { tex.dispose(); return; }
    prep(tex);
    const a = tex.image.width / tex.image.height, H = BG_R * 1.7, L = Math.min(H * a / BG_R, 5.5);
    const g = new THREE.CylinderGeometry(BG_R, BG_R, H, 72, 1, true, Math.PI - L / 2, L);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, opacity: 0, depthWrite: false }));
    m.scale.x = -1; m.renderOrder = ++bgOrder; m.userData.target = 1; scene.add(m);
    bgs.forEach(o => o.userData.target = 0); bgs.push(m);
  }, undefined, () => console.warn('bg failed', file));
}

/* --- portraits (up to 3 billboards standing at depth) --- */
const slots = [0, 1, 2].map(() => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  m.userData = { src: '', target: 0, bright: 1 }; m.renderOrder = 50; scene.add(m); return m;
});
function setPortraits(srcs, speaker) {
  const list = srcs.filter(Boolean), n = list.length;
  const angles = n === 1 ? [0] : n === 2 ? [-.38, .38] : [-.62, 0, .62];
  slots.forEach((m, k) => {
    const src = list[k] || '', u = m.userData;
    if (!src) { u.target = 0; u.src = ''; return; }
    const th = angles[k];
    m.position.set(Math.sin(th) * PORTRAIT_R, -2.4 + PORTRAIT_H / 2, -Math.cos(th) * PORTRAIT_R);
    m.rotation.y = -th; u.baseY = m.position.y; u.target = 1;
    const who = (speaker || '').toLowerCase();
    u.bright = (n > 1 && who && !src.toLowerCase().includes(who.split(' ')[0])) ? .45 : 1;
    if (src === u.src) return;
    u.src = src;
    loader.load(asURL('FC-CHAR/', src), tex => {
      if (u.src !== src) { tex.dispose(); return; }
      prep(tex); m.material.map = tex; m.material.needsUpdate = true;
      const a = tex.image.width / tex.image.height; m.scale.set(PORTRAIT_H * a, PORTRAIT_H, 1);
    });
  });
}

/* ============================ TEXT / PAGES ============================ */
function font(b) { px.font = `${FS}px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`; }
function clean(t) { return String(t || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').trim(); }
function wrap(t) {
  font(); const out = [];
  t.split('\n').forEach(p => { let l = ''; p.split(/\s+/).forEach(w => { const n = l ? l + ' ' + w : w;
    if (px.measureText(n).width > TXW && l) { out.push(l); l = w; } else l = n; }); out.push(l); });
  return out;
}
function paginate(c) {
  const P = [];
  c.scenes.forEach((s, si) => { const L = wrap(clean(s.text));
    for (let k = 0; k < Math.max(L.length, 1); k += MAXL) P.push({ si, lines: L.slice(k, k + MAXL) }); });
  return P;
}
function rr(x, y, w, h, r) { px.beginPath(); px.moveTo(x + r, y); px.arcTo(x + w, y, x + w, y + h, r);
  px.arcTo(x + w, y + h, x, y + h, r); px.arcTo(x, y + h, x, y, r); px.arcTo(x, y, x + w, y, r); px.closePath(); }
function draw(n) {
  px.clearRect(0, 0, PW, PH);
  const pg = pages[i], sc = cfg.scenes[pg.si];
  px.fillStyle = 'rgba(17,9,9,.84)'; rr(20, 40, PW - 40, PH - 60, 26); px.fill();
  px.strokeStyle = '#e2505f'; px.lineWidth = 3; px.stroke();
  if (sc.character) {
    font(true); const w = Math.max(200, px.measureText(sc.character).width + 70);
    px.fillStyle = '#e2505f'; rr(50, 14, w, 56, 16); px.fill();
    px.fillStyle = '#fff'; px.textBaseline = 'middle'; px.fillText(sc.character, 85, 43);
  }
  font(); px.textBaseline = 'alphabetic'; px.fillStyle = '#f7eeee';
  let left = n;
  pg.lines.forEach((l, k) => { if (left <= 0) return; px.fillText(l.slice(0, left), 70, 125 + k * LH); left -= l.length; });
  px.font = `22px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`; px.fillStyle = 'rgba(255,176,182,.7)'; px.textAlign = 'right';
  px.fillText(`${i + 1} / ${pages.length}`, PW - 60, PH - 36);
  if (n >= total && Math.floor(performance.now() / 500) % 2) px.fillText('▼', PW - 60, PH - 66);
  px.textAlign = 'left'; ptex.needsUpdate = true;
}

/* ============================ STORY STATE ============================ */
let bf = null;
let cfg = null, pages = [], i = 0, shown = 0, total = 0, curSi = -1, nextFile = null, auto = false, autoT = 0, lastDrawn = -1, ui = true;
let muted = false;
/* --- audio: one reusable <audio> for music (crossfaded), Web Audio for sound effects --- */
const SET = (() => { try { return Object.assign({ musicVol: 70, sfxVol: 80 }, JSON.parse(localStorage.getItem('fc_settings') || '{}')); } catch (e) { return { musicVol: 70, sfxVol: 80 }; } })();
const MV = SET.musicVol / 100, SV = SET.sfxVol / 100;
const bgm = new Audio(); bgm.loop = true; bgm.preload = 'auto'; bgm.volume = 0;
bgm.onerror = () => console.warn('music failed to load:', bgm.src);
let ac = null, curTrack = null, fadeT = null; const sfxBuf = new Map();
function unlockAudio() { // call from a click/tap so phones & Safari allow sound later
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  bgm.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  bgm.play().catch(() => {});
}
function music(f) { // undefined = keep playing, ''/'none' = stop, else crossfade to FC-OST/<f>
  if (f === undefined) return;
  const want = f && f !== 'none' ? f : null;
  if (want === curTrack) return; curTrack = want;
  clearInterval(fadeT); let v = bgm.paused ? 0 : bgm.volume;
  const fadeIn = () => {
    if (!curTrack) return;
    bgm.src = asURL('FC-OST/', curTrack); bgm.muted = muted; bgm.volume = 0; bgm.play().catch(() => {});
    v = 0; fadeT = setInterval(() => { v = Math.min(MV, v + MV / 24); bgm.volume = v; if (v >= MV) clearInterval(fadeT); }, 50);
  };
  if (v <= 0) return fadeIn();
  fadeT = setInterval(() => { v = Math.max(0, v - MV / 24); bgm.volume = v; if (v <= 0) { clearInterval(fadeT); bgm.pause(); fadeIn(); } }, 50);
}
function sfxLoad(f) {
  const url = asURL('FC-MEDIA/', f); let b = sfxBuf.get(url);
  if (!b && ac) { b = fetch(url).then(r => r.arrayBuffer()).then(a => ac.decodeAudioData(a)); sfxBuf.set(url, b); b.catch(() => console.warn('sfx failed:', f)); }
  return b;
}
function sfx(f) {
  if (!f || muted || !ac) return; const b = sfxLoad(f); if (!b) return;
  b.then(buf => { const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = buf; g.gain.value = SV; src.connect(g); g.connect(ac.destination); src.start(); }).catch(() => {});
}
function applyScene(s, quiet) {
  let bg = s.bg;
  if ((!bg || bg === 'blank') && s.bgSequence) {
    const q = (Array.isArray(s.bgSequence) ? s.bgSequence : [s.bgSequence]).find(x => x && x.bg && x.bg !== 'blank'); bg = q && q.bg;
  }
  setBg(bg); music(s.music); if (!quiet) sfx(s.sfx);
  const nx = cfg.scenes[curSi + 1]; if (nx && nx.sfx) sfxLoad(nx.sfx);
  setPortraits([s.portrait1 || s.portrait || s.standingPortrait || '', s.portrait2 || '', s.portrait3 || ''], s.character);
}
function enter(full) {
  const pg = pages[i];
  if (pg.si !== curSi) { curSi = pg.si; applyScene(cfg.scenes[curSi], full); }
  total = pg.lines.reduce((a, l) => a + l.length, 0); shown = full ? total : 0; lastDrawn = -1; autoT = 0;
}
function go(d) {
  if (!cfg || bf) return;
  if (d > 0 && shown < total) { shown = total; return; }
  const ni = i + d;
  if (ni >= pages.length) { if (nextFile) loadChapter(nextFile); return; }
  if (ni < 0) return;
  i = ni; enter(d < 0);
}
function msg(t) { cfg = { chapter: '', scenes: [{ character: '', text: t }] }; pages = paginate(cfg); nextFile = null; i = 0; curSi = -1; enter(); }
function battle(file) {
  if (document.pointerLockElement) document.exitPointerLock();
  bgm.pause();
  bf = document.createElement('iframe'); bf.src = file; bf.setAttribute('scrolling', 'no');
  bf.style.cssText = `position:fixed;left:0;top:0;width:${BW}px;height:${BH}px;border:0;z-index:-1`;
  document.body.appendChild(bf); battleMode(true);
  const base = file.split('/').pop(), timer = setInterval(() => {
    let p = ''; try { p = bf.contentWindow.location.pathname.split('/').pop(); } catch (e) { return; }
    if (!p || p === 'blank' || p === base) return;
    clearInterval(timer); bf.remove(); bf = null; battleMode(false); window.focus();
    if (curTrack) bgm.play().catch(() => {});
    loadChapter(decodeURIComponent(p));
  }, 400);
}
function battleMode(on) {
  bscreen.visible = reticle.visible = on; panel.visible = !on;
  if (on) { curBg = ''; bgs.forEach(o => o.userData.target = 0); setPortraits([], ''); }
}
async function loadChapter(file) {
  try {
    const r = await fetch(file); if (!r.ok) throw new Error(r.status);
    const html = await r.text(), a = html.indexOf('window.FC_CONFIG');
    if (a < 0 && html.includes('window.ENCOUNTER')) return battle(file);
    if (a < 0) return msg(`${file} is a 2D-only section (map or menu). Open it in the normal build.`);
    const code = html.slice(a, html.indexOf('<\/script>', a)), w = {}; new Function('window', code)(w);
    if (!w.FC_CONFIG || !w.FC_CONFIG.scenes) throw new Error('no scenes');
    const am = html.match(/<audio[^>]*id=["']bgm["'][^>]*>/), sm = am && am[0].match(/src=["']([^"']*)["']/);
    music(sm && sm[1] ? decodeURIComponent(sm[1].replace(/^FC-OST\//, '')) : 'none');
    cfg = w.FC_CONFIG; nextFile = cfg.nextFile || null; pages = paginate(cfg); i = 0; curSi = -1; enter();
    document.title = (cfg.chapter || file) + ' — 3D';
  } catch (e) { msg(`Couldn't load ${file}. (${e.message}) Make sure vr.html sits next to the scene files and is served over http.`); }
}

/* ============================ INPUT / LOOK ============================ */
let tYaw = 0, tPitch = 0, yaw = 0, pitch = 0, gyro = false, gQ = new THREE.Quaternion(), gOff = new THREE.Quaternion(), gRaw = new THREE.Quaternion();
const zee = new THREE.Vector3(0, 0, 1), up = new THREE.Vector3(0, 1, 0), eul = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
addEventListener('mousemove', e => {
  if (gyro) return;
  if (document.pointerLockElement) {
    tYaw = Math.max(-1.6, Math.min(1.6, tYaw - e.movementX * .0022));
    tPitch = Math.max(-PITCH_MAX * 1.4, Math.min(PITCH_MAX * 1.4, tPitch - e.movementY * .0022));
  } else {
    tYaw = -(e.clientX / innerWidth - .5) * 2 * YAW_MAX;
    tPitch = -(e.clientY / innerHeight - .5) * 2 * PITCH_MAX;
  }
});
addEventListener('mousedown', e => {
  if ($('start').style.display !== 'none') return;
  if (bf) { if (e.button === 0) bclick(); else if (e.button === 2) fwd('Escape'); return; }
  if (e.button === 0 && cfg) go(1); if (e.button === 2) go(-1);
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('touchstart', e => { if (cfg && $('start').style.display === 'none' && e.target === R.domElement) bf ? bclick() : go(1); }, { passive: true });
addEventListener('wheel', e => { go(e.deltaY > 0 ? 1 : -1); }, { passive: true });
function onOrient(e) {
  if (e.alpha == null) return;
  const o = (screen.orientation ? screen.orientation.angle : 0) * Math.PI / 180;
  eul.set(e.beta * Math.PI / 180, e.alpha * Math.PI / 180, -e.gamma * Math.PI / 180, 'YXZ');
  gRaw.setFromEuler(eul).multiply(q1).multiply(q0.setFromAxisAngle(zee, -o));
}
async function enableGyro() {
  try {
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
    addEventListener('deviceorientation', onOrient); gyro = true; setTimeout(recenter, 400);
  } catch (e) {}
}
function recenter() {
  if (gyro) { eul.setFromQuaternion(gRaw, 'YXZ'); gOff.setFromAxisAngle(up, -eul.y); }
  else { tYaw = tPitch = 0; }
}
function setStereo(on) { stereo = on; resize(); updateHint(); }
function resize() {
  const W = innerWidth, H = innerHeight; R.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix();
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(Math.ceil(W / 2 * R.getPixelRatio()), Math.ceil(H * R.getPixelRatio()));
  rt.texture.minFilter = THREE.LinearFilter; qMat.uniforms.t.value = rt.texture;
}
addEventListener('resize', resize);
addEventListener('keydown', e => {
  if ($('start').style.display !== 'none') return;
  const k = e.key.toLowerCase();
  if (bf) {
    if ([' ', 'enter', 'z'].includes(k)) { bclick(); e.preventDefault(); return; }
    if (k.length > 1 || !'vdrglfm[]'.includes(k)) { fwd(e.key, e.code); e.preventDefault(); return; }
  }
  if ([' ', 'enter', 'arrowright', 'arrowdown', 'z'].includes(k)) { go(1); e.preventDefault(); }
  else if (['backspace', 'arrowleft', 'arrowup', 'x'].includes(k)) { go(-1); e.preventDefault(); }
  else if (k === 'v') setStereo(!stereo);
  else if (k === 'd') distort = !distort;
  else if (k === '[') qMat.uniforms.k1.value = K1 = Math.max(0, K1 - .02);
  else if (k === ']') qMat.uniforms.k1.value = K1 = K1 + .02;
  else if (k === 'r') recenter();
  else if (k === 'g') { gyro ? (gyro = false, removeEventListener('deviceorientation', onOrient)) : enableGyro(); }
  else if (k === 'l') { document.pointerLockElement ? document.exitPointerLock() : R.domElement.requestPointerLock(); }
  else if (k === 'h') panel.visible = !panel.visible;
  else if (k === 'a') auto = !auto;
  else if (k === 'm') { muted = !muted; bgm.muted = muted; }
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
});
function updateHint() {
  $('hint').textContent = stereo ? '' :
    'Mouse: look   Click/Space/Enter: next   Right-click/Backspace: back   Wheel: next/back\n' +
    'V: Cardboard split   D: lens distortion   [ ]: lens strength   G: gyro   R: recenter\n' +
    'L: free-look (pointer lock)   H: hide text   A: auto   M: mute   F: fullscreen\n' +
    'Battles: look at a button (white dot), then click / Enter. Right-click = Esc. Other keys go to the battle.';
}


/* ============================ BATTLE IN 3D ============================ */
/* The real battle page runs hidden in an iframe. Each frame we repaint its DOM onto a canvas,
   show that canvas on a curved screen, and turn your gaze (screen centre) into clicks. */
var BW = 1120, BH = 630;
const bc = document.createElement('canvas'); bc.width = BW; bc.height = BH;
const bx = bc.getContext('2d');
const btex = new THREE.CanvasTexture(bc); btex.encoding = THREE.sRGBEncoding; btex.minFilter = THREE.LinearFilter; btex.generateMipmaps = false;
const BR = 4.2, BL = 1.5;
const bscreen = new THREE.Mesh(new THREE.CylinderGeometry(BR, BR, BR * BL * BH / BW, 48, 1, true, Math.PI - BL / 2, BL),
  new THREE.MeshBasicMaterial({ map: btex, side: THREE.DoubleSide }));
bscreen.scale.x = -1; bscreen.visible = false; scene.add(bscreen);
const reticle = new THREE.Mesh(new THREE.RingGeometry(.018, .03, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
reticle.renderOrder = 200; reticle.visible = false; cam.add(reticle); scene.add(cam);
const ray = new THREE.Raycaster(), imgs = new Map(); let gz = { x: 0, y: 0, ok: false }, lastB = 0;
